*{box-sizing:border-box}

<style>
#jumpscare {
  position:fixed; inset:0; z-index:999999;
  display:none; background:#000; color:white;
  font-family:Arial,sans-serif; text-align:center;
  overflow:hidden; align-items:center; justify-content:center;
  flex-direction:column;
}
#jumpscare.show { display:flex; }
#scareTitle {
  font-size:clamp(44px,10vw,110px); font-weight:1000;
  color:#ff1010; text-shadow:4px 0 #00ffff,-4px 0 #ff006a;
  animation:glitch .08s infinite;
}
#scaryFace {
  display:none; font-size:clamp(150px,35vw,360px);
  line-height:1; filter:contrast(2) saturate(2);
  text-shadow:0 0 35px red;
  animation:pop .12s steps(2) infinite;
}
#scaryFace.show { display:block; }
#backBtn {
  display:none; margin-top:25px; padding:13px 35px;
  border:2px solid #ff0050; border-radius:25px;
  background:#111; color:white; font-size:18px;
  cursor:pointer;
}
#backBtn.show { display:block; }
@keyframes pop {
  from { transform:scale(.65) rotate(-4deg); }
  to { transform:scale(1.08) rotate(4deg); }
}
@keyframes glitch {
  0% { transform:translate(3px,-2px); }
  50% { transform:translate(-3px,2px); }
  100% { transform:translate(1px,1px); }
}
#jumpscare.flash { animation:flash .08s steps(2) infinite; }
@keyframes flash { 50% { background:#240000; } }
</style><style>
#scareScreen {
  position:fixed; inset:0; z-index:9999999;
  display:none; background:#000; overflow:hidden;
}
#scareScreen.active { display:block; animation:scareFlash .09s steps(2) 6; }
#scareScreen img {
  position:absolute; width:100%; height:100%; object-fit:cover;
  transform:scale(.1); filter:contrast(1.5) saturate(1.5);
}
#scareScreen.active img {
  animation:scareZoom .24s cubic-bezier(.1,1.5,.3,1) forwards;
}
#scareClose {
  display:none; position:absolute; z-index:2; bottom:30px; left:50%;
  transform:translateX(-50%); padding:14px 28px;
  color:white; background:#111; border:2px solid red;
  border-radius:10px; font-size:18px; cursor:pointer;
}
#scareClose.show { display:block; }
@keyframes scareZoom {
  0% { transform:scale(.1) rotate(-8deg); }
  70% { transform:scale(1.15) rotate(3deg); }
  100% { transform:scale(1.03); }
}
@keyframes scareFlash {
  0%,100% { background:#000; }
  50% { background:#6b0000; }
}
</style><style id="scare-effects">
#scareScreen {
  position:fixed; inset:0; z-index:2147483647; display:none;
  background:#000; overflow:hidden; isolation:isolate;
}
#scareScreen.active { display:block; }
#scareImage {
  position:absolute; inset:-3%; width:106%; height:106%;
  object-fit:cover; object-position:center; opacity:0;
  transform:scale(.18); filter:contrast(1.45) saturate(1.35) brightness(.82);
  will-change:transform,opacity;
}
#scareImage.visible { opacity:1; }
#scareIntro {
  position:absolute; inset:0; z-index:4; display:flex; align-items:center;
  justify-content:center; padding:24px; background:#030303; color:#ff123f;
  font:1000 clamp(42px,10vw,112px)/1 Arial,sans-serif; text-align:center;
  letter-spacing:-2px; text-shadow:4px 0 #25f4ee,-4px 0 #ff2c55,0 0 30px #f00;
  animation:introGlitch .13s steps(2,end) infinite;
}
#scareIntro.gone { display:none; }
#scareScreen.scare-hit #scareImage {
  animation:scareLunge .32s cubic-bezier(.08,1.8,.22,1) forwards, scareJitter .075s .32s 12;
}
#scareVignette {
  position:absolute; inset:0; pointer-events:none; opacity:0;
  background:radial-gradient(ellipse at center,transparent 25%,rgba(0,0,0,.78) 100%);
}
#scareScreen.scare-hit #scareVignette { opacity:1; }
#scareScreen.scare-flash { animation:scarePulse .09s steps(2,end) 5; }
#scareClose {
  display:none; position:absolute; z-index:6; left:50%; bottom:26px;
  transform:translateX(-50%); padding:13px 26px; border:2px solid #ff2c55;
  border-radius:10px; background:#090909; color:#fff; font-size:16px;
  font-weight:700; cursor:pointer; box-shadow:0 0 24px #ff003c88;
}
#scareClose.show { display:block; }
@keyframes scareLunge {
  0% { transform:scale(.18) rotate(-3deg); }
  58% { transform:scale(1.22) rotate(1.5deg); }
  76% { transform:scale(.96) rotate(-1deg); }
  100% { transform:scale(1.07) rotate(0); }
}
@keyframes scareJitter {
  0% { transform:translate(0,0) scale(1.07); }
  25% { transform:translate(-12px,5px) scale(1.1); }
  50% { transform:translate(9px,-6px) scale(1.04); }
  75% { transform:translate(-6px,-3px) scale(1.09); }
  100% { transform:translate(0,0) scale(1.07); }
}
@keyframes scarePulse {
  0%,100% { background:#000; }
  50% { background:#690012; }
}
@keyframes introGlitch {
  0% { transform:translate(1px,-1px); }
  50% { transform:translate(-1px,1px); }
  100% { transform:translate(0,0); }
}
@media (prefers-reduced-motion: reduce) {
  #scareIntro { animation:none; }
}
</style>

<div id="jumpscare">
  <div id="scareTitle">AĞLA, ZAKİR!</div>
  <div id="scaryFace" aria-label="Jumpscare">😈</div>
  <button id="backBtn" type="button">Geri qayıt</button>
</div><div id="scareScreen" aria-live="assertive">
  <div id="scareIntro">AĞLA, ZAKİR!</div>
  <img id="scareImage" src="./scare.jpg" alt="Jumpscare">
  <div id="scareVignette"></div>
  <button id="scareClose" type="button">GERİ QAYIT</button>
</div><script>
(function () {
  const btn = document.getElementById("demo");
  const screen = document.getElementById("scareScreen");
  const img = document.getElementById("scareImage");
  const intro = document.getElementById("scareIntro");
  const close = document.getElementById("scareClose");
  const user = document.getElementById("username");
  const pass = document.getElementById("password");

  if (!btn || !screen || !img || !intro || !close) return;

  function showError(field, message) {
    const box = document.getElementById(field.id + "Error");
    field.classList.toggle("invalid", Boolean(message));
    if (box) {
      box.textContent = message || "";
      box.classList.toggle("show", Boolean(message));
    }
  }

  [user, pass].filter(Boolean).forEach(function (field) {
    field.addEventListener("input", function () { showError(field, ""); });
  });

  function playScareSound() {
    try {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      if (!AudioCtx) return;
      const ctx = new AudioCtx();
      const duration = 0.75;
      const count = Math.floor(ctx.sampleRate * duration);
      const buffer = ctx.createBuffer(1, count, ctx.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < count; i++) {
        const envelope = Math.pow(1 - i / count, 1.8);
        data[i] = (Math.random() * 2 - 1) * envelope;
      }
      const source = ctx.createBufferSource();
      const filter = ctx.createBiquadFilter();
      const gain = ctx.createGain();
      filter.type = "lowpass";
      filter.frequency.setValueAtTime(1800, ctx.currentTime);
      filter.frequency.exponentialRampToValueAtTime(180, ctx.currentTime + duration);
      gain.gain.setValueAtTime(0.001, ctx.currentTime);
      gain.gain.linearRampToValueAtTime(0.42, ctx.currentTime + 0.025);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
      source.buffer = buffer;
      source.connect(filter);
      filter.connect(gain);
      gain.connect(ctx.destination);
      source.start();
      source.onended = function () { ctx.close(); };
    } catch (e) {}
  }

  btn.addEventListener("click", function () {
    if (user && pass) {
      const validUser = user.value.trim();
      const validPass = pass.value;
      showError(user, validUser ? "" : "Username yazılmalıdır.");
      showError(pass, validPass ? "" : "Password yazılmalıdır.");
      if (!validUser || !validPass) return;
      // Local-only prank: entered values are not sent or saved.
      user.value = "";
      pass.value = "";
    }

    screen.classList.remove("scare-hit", "scare-flash");
    close.classList.remove("show");
    img.classList.remove("visible");
    intro.classList.remove("gone");
    screen.classList.add("active", "intro-mode");

    // Short pause after the message, with a little unpredictable delay.
    const delay = 1250 + Math.floor(Math.random() * 1050);
    window.setTimeout(function () {
      if (!screen.classList.contains("active")) return;
      intro.classList.add("gone");
      screen.classList.remove("intro-mode");
      screen.classList.add("scare-hit", "scare-flash");
      img.classList.add("visible");
      playScareSound();
      window.setTimeout(function () {
        close.classList.add("show");
      }, 1600);
    }, delay);
  });

  img.addEventListener("error", function () {
    intro.textContent = "ŞƏKİL TAPILMADI — scare.jpg faylını index.html ilə eyni qovluğa qoy.";
    intro.classList.remove("gone");
  });

  close.addEventListener("click", function () {
    screen.classList.remove("active", "scare-hit", "scare-flash", "intro-mode");
    close.classList.remove("show");
    img.classList.remove("visible");
    intro.classList.remove("gone");
  });
})();
</script></body>
</html>
